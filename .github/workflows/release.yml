# Builds Halcyon installers on all three desktop platforms.
# macOS and Linux packages can only be produced on those OSes, so this runs on
# GitHub-hosted runners. Trigger: push a tag like v0.2.0, or run it manually.
# Output: a draft GitHub Release with the installers attached (and workflow artifacts).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel, cross-compiled on Apple silicon
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # Everything except the libVLC engine tests (runners have no VLC). Lab and
      # converter tests run where the runner has FFmpeg and skip otherwise.
      - name: Tests (storage, parsers, fuzzing, lab, converter)
        working-directory: src-tauri
        run: cargo test --lib -- fuzz db:: sources:: library:: lab:: convert::

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Halcyon {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # Bundler tool downloads (WiX/NSIS/AppImage) occasionally hit 5xx; retry once.
      - uses: tauri-apps/tauri-action@v0
        if: steps.tauri.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Halcyon {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: SBOM (CycloneDX)
        if: startsWith(matrix.platform, 'ubuntu')
        run: node scripts/sbom.mjs sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: halcyon-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            sbom.cdx.json
          if-no-files-found: warn
