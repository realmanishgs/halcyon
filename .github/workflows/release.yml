# Builds Halcyon installers on all three desktop platforms.
# macOS and Linux packages can only be produced on those OSes, so this runs on
# GitHub-hosted runners. Trigger: push a tag like v0.2.0, or run it manually.
# Output: a draft GitHub Release with the installers attached (and workflow artifacts).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # runtime: libVLC + FFmpeg downloaded into the installer (scripts/fetch-runtime.sh).
          # Linux packages depend on the distribution's libvlc instead.
          - platform: windows-latest
            runtime: windows
            args: "--config src-tauri/tauri.runtime.windows.json"
          - platform: macos-latest # Apple silicon
            runtime: macos-arm64
            triple: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --config src-tauri/tauri.runtime.macos.json"
          - platform: macos-latest # Intel, cross-compiled on Apple silicon
            runtime: macos-x64
            triple: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --config src-tauri/tauri.runtime.macos.json"
          - platform: ubuntu-22.04
            runtime: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # Everything except the libVLC engine tests (runners have no VLC). Lab and
      # converter tests run where the runner has FFmpeg and skip otherwise.
      - name: Tests (storage, parsers, fuzzing, lab, converter)
        working-directory: src-tauri
        run: "cargo test --lib -- fuzz db:: sources:: library:: lab:: convert::"

      - name: Bundle libVLC and FFmpeg
        if: matrix.runtime != ''
        shell: bash
        run: bash scripts/fetch-runtime.sh ${{ matrix.runtime }}

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Halcyon {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # Bundler tool downloads (WiX/NSIS/AppImage) occasionally hit 5xx; retry once.
      - uses: tauri-apps/tauri-action@v0
        if: steps.tauri.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Halcyon {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # Prove the packages work on a machine with no VLC or FFmpeg installed.
      - name: Smoke test the installed Windows app
        if: matrix.runtime == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\VideoLAN\VLC") { Write-Host "note: runner has VLC installed" }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Halcyon\*.exe" | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "--check" -Wait -PassThru -RedirectStandardOutput check.txt
          Get-Content check.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path check.txt -Pattern "Halcyon\vlc" -SimpleMatch -Quiet)) { throw "installed app did not load its bundled libVLC/FFmpeg" }

      - name: Smoke test the macOS app
        if: startsWith(matrix.runtime, 'macos')
        continue-on-error: ${{ matrix.runtime == 'macos-x64' }} # needs Rosetta on the runner
        run: |
          app=$(ls -d src-tauri/target/${{ matrix.triple }}/release/bundle/macos/*.app | head -1)
          "$app"/Contents/MacOS/* --check | tee check.txt
          grep -q "Resources/vlc" check.txt

      - name: SBOM (CycloneDX)
        if: startsWith(matrix.platform, 'ubuntu')
        run: node scripts/sbom.mjs sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: halcyon-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            sbom.cdx.json
          if-no-files-found: warn
